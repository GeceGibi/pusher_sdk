name: pusher
description: Pusher mobile SDK — device hello and notification receipts.
publish_to: none
version: 0.0.3
homepage: https://github.com/GeceGibi/pusher_sdk

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  crypto: ^3.0.6

  device_helpers:
    git:
      url: https://github.com/GeceGibi/device_helpers.git

  firebase_messaging: ^16.0.0

  flutter:
    sdk: flutter

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.9.5
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pusher.sdk
        pluginClass: PusherPlugin
      ios:
        pluginClass: PusherPlugin
