name: pusher
description: Device hello and notification receipt client for stats.pusher.tr.
publish_to: none
version: 0.7.0
homepage: https://github.com/GeceGibi/pusher_sdk

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  device_helpers:
    git:
      url: https://github.com/GeceGibi/device_helpers.git
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pusher.sdk
        pluginClass: PusherPlugin
      ios:
        pluginClass: PusherPlugin
